# Publie une version installable (frontend compilé inclus) à chaque tag v*.
# deploy/proxmox-install.sh télécharge l'archive de la dernière version.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests backend
        working-directory: backend
        run: |
          pip install -e '.[dev]'
          ruff check .
          pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm run build

      - name: Numéro de version = tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${GITHUB_REF_NAME#v}"
          sed -i "s/^__version__ = .*/__version__ = \"$v\"/" backend/src/naomox/__init__.py
          sed -i "0,/^version = .*/s//version = \"$v\"/" backend/pyproject.toml
          grep -H "version" backend/src/naomox/__init__.py

      - name: Archive
        run: |
          tar --owner=0 --group=0 --exclude='__pycache__' --exclude='*.egg-info' \
            -czf naomox.tar.gz backend/pyproject.toml backend/README.md backend/src \
            frontend/dist deploy homebrew README.md
          ls -la naomox.tar.gz

      - name: Publication
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" naomox.tar.gz --title "NAOMOX $GITHUB_REF_NAME" --generate-notes
