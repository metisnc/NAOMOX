[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "naomox"
version = "0.1.0"
description = "Netbooter web pour NetDIMM Sega Naomi / Naomi 2 / Chihiro / Triforce"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT (naomox) / Public Domain (netdimm vendored)" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "pycryptodome>=3.19",
    "arcadeutils>=0.1.11",
    "pillow>=10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.scripts]
naomox = "naomox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
naomox = ["py.typed", "data/*.csv"]
netdimm = ["py.typed", "LICENSE", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning:arcadeutils.*"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
# Code tiers : bibliothèque vendorisée telle quelle (domaine public).
extend-exclude = ["src/netdimm"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["naomox", "netdimm"]

[tool.ruff.lint.per-file-ignores]
# Les tests attendent des conditions par sondage court : acceptable ici.
"tests/**" = ["ASYNC110"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Query", "fastapi.Depends"]
